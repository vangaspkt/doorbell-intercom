name: Tự động Build APK Chuông Cửa

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Cài đặt JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cấp quyền thực thi cho Gradle Wrapper
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --console=plain > build.log 2>&1 || {
          echo "### ❌ Chi tiết lỗi biên dịch:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1
        }

    - name: Lưu trữ file APK cài đặt
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ChuongCua-ESP32-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Tải file log lỗi
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
